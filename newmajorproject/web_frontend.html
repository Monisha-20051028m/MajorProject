<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Learning App</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5em;
        }

        /* Navigation */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-tab {
            background: #f8f9fa;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .nav-tab:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }

        .nav-tab.active {
            background: #007bff;
            color: white;
            border-color: #0056b3;
        }

        /* Search and Controls */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #007bff;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .timer-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .stop-btn {
            background: #dc3545 !important;
            margin-top: 10px;
        }

        .stop-btn:hover {
            background: #c82333 !important;
        }

        .focus-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .focus-btn:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        /* Progress */
        .progress-section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #007bff, #28a745);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .content-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .card-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 48px;
        }

        .card-content {
            padding: 15px;
        }

        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .card-description {
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #6c757d;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .card-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .read-btn {
            background: #007bff;
            color: white;
        }

        .read-btn:hover {
            background: #0056b3;
        }

        .summarize-btn {
            background: #6f42c1;
            color: white;
        }

        .summarize-btn:hover {
            background: #5a359a;
        }

        /* Shorts Layout */
        .shorts-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .short-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .short-thumbnail {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #007bff, #28a745);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
        }

        .short-content {
            flex: 1;
        }

        .short-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .watch-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }

        .watch-btn:hover {
            background: #c82333;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #6c757d;
        }

        /* Timer Display */
        .timer-display {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-text {
            font-size: 48px;
            font-weight: bold;
            color: #2c3e50;
            font-family: 'Courier New', monospace;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 50px;
            color: white;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-tabs {
                flex-direction: column;
                align-items: center;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .search-box {
                max-width: 100%;
            }

            .content-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header" style="position: relative;">
            <div id="authContainer" style="position: absolute; top: 10px; right: 10px;">
                <button id="authBtn" class="card-btn" onclick="showAuthModal()" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid white;">
                    <i class="fas fa-user"></i> Login / Sign Up
                </button>
            </div>
            <h1>🚀 Productivity Learning App</h1>
            <div id="contentStatus" style="text-align: center; color: #6c757d; font-size: 14px; margin-bottom: 10px;">
                <i class="fas fa-info-circle"></i> Loading real content from APIs...
            </div>

            <!-- Navigation Tabs — Inshorts style categories -->
            <div class="nav-tabs" id="categoryTabs" style="flex-wrap:wrap;">
                <button class="nav-tab active" onclick="switchCategory('all')" data-cat="all">
                    <i class="fas fa-globe"></i> All
                </button>
                <button class="nav-tab" onclick="switchCategory('trending')" data-cat="trending">
                    <i class="fas fa-fire"></i> Trending
                </button>
                <button class="nav-tab" onclick="switchCategory('world')" data-cat="world">
                    <i class="fas fa-earth-americas"></i> World
                </button>
                <button class="nav-tab" onclick="switchCategory('war')" data-cat="war">
                    <i class="fas fa-bolt"></i> War
                </button>
                <button class="nav-tab" onclick="switchCategory('science')" data-cat="science">
                    <i class="fas fa-flask"></i> Science
                </button>
                <button class="nav-tab" onclick="switchCategory('tech')" data-cat="tech">
                    <i class="fas fa-microchip"></i> Tech
                </button>
                <button class="nav-tab" onclick="switchCategory('health')" data-cat="health">
                    <i class="fas fa-heart-pulse"></i> Health
                </button>
                <button class="nav-tab" onclick="switchCategory('business')" data-cat="business">
                    <i class="fas fa-briefcase"></i> Business
                </button>
                <button class="nav-tab" onclick="switchCategory('sports')" data-cat="sports">
                    <i class="fas fa-trophy"></i> Sports
                </button>
                <button class="nav-tab" onclick="switchCategory('bookmarks')" data-cat="bookmarks" style="background: rgba(255, 193, 7, 0.2); color: #ffc107; border: 1px solid #ffc107;">
                    <i class="fas fa-bookmark"></i> Bookmarks
                </button>
            </div>

            <!-- Search and Controls -->
            <div class="controls">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="Search for topics..." id="searchInput">
                    <button class="search-btn" onclick="performSearch()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <button class="timer-btn" onclick="startTimer(5)">5 Min</button>
                <button class="timer-btn" onclick="startTimer(10)">10 Min</button>
                <button class="timer-btn" onclick="startTimer(15)">15 Min</button>
                <button class="focus-btn" id="focusBtn" onclick="toggleFocus()">
                    <i class="fas fa-lock"></i> Lock Focus
                </button>
            </div>
        </div>



        <!-- Timer Display -->
        <div class="timer-display" id="timerDisplay" style="display: none;">
            <div class="timer-text" id="timerText">00:00</div>
            <p>Focus session in progress...</p>
            <button class="timer-btn stop-btn" onclick="stopTimer()">Stop Session</button>
        </div>

        <!-- Content Areas -->
        <div id="homeContent" class="content-grid">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading content...</p>
            </div>
        </div>

        <div id="shortsContent" class="shorts-container" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading shorts...</p>
            </div>
        </div>

        <div id="videosContent" class="content-grid" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading videos...</p>
            </div>
        </div>

        <div id="blogsContent" class="content-grid" style="display: none;">
            <div class="loading">
                <div class="spinner"></div>
                <p>Loading blogs...</p>
            </div>
        </div>
    </div>

    <!-- Modal for content details -->
    <div id="contentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Content Title</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div id="modalBody">
                <!-- Content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Modal for Auth -->
    <div id="authModal" class="modal" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 400px; text-align: center;">
            <div class="modal-header">
                <h2 class="modal-title" id="authModalTitle">Welcome</h2>
                <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            </div>
            <div id="authModalBody" style="padding: 20px 0;">
                <p id="authError" style="color: #dc3545; display: none;"></p>
                <input type="text" id="authUsername" placeholder="Username" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 5px;">
                <input type="password" id="authPassword" placeholder="Password" style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 5px;">
                <button class="card-btn read-btn" onclick="handleAuth('login')" style="width: 100%; margin-bottom: 10px;">Login</button>
                <button class="card-btn" onclick="handleAuth('signup')" style="width: 100%; background: #28a745;">Sign Up</button>
            </div>
        </div>
    </div>

    <!-- Modal for Profile -->
    <div id="profileModal" class="modal" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h2 class="modal-title" id="profileModalTitle"><i class="fas fa-user-circle"></i> My Profile</h2>
                <button class="close-btn" onclick="closeProfileModal()">&times;</button>
            </div>
            <div id="profileModalBody" style="padding: 20px 0;">
                <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                    <div style="flex: 1; background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: #667eea;" id="statTotalRead">0</div>
                        <div style="font-size: 14px; color: #6c757d;">Articles Read</div>
                    </div>
                    <div style="flex: 1; background: #f8f9fa; padding: 15px; border-radius: 10px; text-align: center;">
                        <div style="font-size: 24px; font-weight: bold; color: #28a745;" id="statMostViewed">-</div>
                        <div style="font-size: 14px; color: #6c757d;">Favorite Category</div>
                    </div>
                </div>
                <h3 style="margin-bottom: 15px;">Recent History</h3>
                <div id="profileHistoryList" style="max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;">
                    <!-- History items will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- Auth Logic ---
        function checkAuth() {
            const user = localStorage.getItem('currentUser');
            const authContainer = document.getElementById('authContainer');
            if (user) {
                authContainer.innerHTML = `
                    <button class="card-btn" onclick="showProfileModal()" style="background: rgba(102,126,234,0.8); color: white; border: none; margin-right: 10px;">
                        <i class="fas fa-user-circle"></i> My Profile
                    </button>
                    <button class="card-btn" onclick="logout()" style="background: rgba(220,53,69,0.8); color: white; border: none; padding: 5px 15px; font-size: 12px;">Logout</button>
                `;
            } else {
                authContainer.innerHTML = `
                    <button id="authBtn" class="card-btn" onclick="showAuthModal()" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid white;">
                        <i class="fas fa-user"></i> Login / Sign Up
                    </button>
                `;
            }
        }

        function showAuthModal() {
            document.getElementById('authError').style.display = 'none';
            document.getElementById('authUsername').value = '';
            document.getElementById('authPassword').value = '';
            document.getElementById('authModal').style.display = 'block';
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = 'none';
        }

        async function handleAuth(action) {
            const u = document.getElementById('authUsername').value;
            const p = document.getElementById('authPassword').value;
            if(!u || !p) return;
            
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/auth/${action}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                const data = await res.json();
                if(res.ok) {
                    localStorage.setItem('currentUser', data.username);
                    closeAuthModal();
                    checkAuth();
                    if(currentCategory === 'bookmarks') loadCategoryContent('bookmarks');
                } else {
                    const err = document.getElementById('authError');
                    err.innerText = data.error;
                    err.style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }

        function logout() {
            localStorage.removeItem('currentUser');
            checkAuth();
            if(currentCategory === 'bookmarks') switchCategory('all');
        }
        
        async function bookmarkArticle(item, btnEvent) {
            const user = localStorage.getItem('currentUser');
            if(!user) {
                showAuthModal();
                return;
            }
            try {
                const res = await fetch('http://127.0.0.1:5000/api/bookmarks', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, article: item})
                });
                if(res.ok) {
                    const btn = btnEvent ? btnEvent.currentTarget : event.currentTarget;
                    btn.innerHTML = '<i class="fas fa-bookmark"></i> Saved!';
                    btn.style.background = '#28a745';
                    btn.style.color = '#fff';
                }
            } catch(e) { console.error(e); }
        }

        async function trackHistory(item) {
            const user = localStorage.getItem('currentUser');
            if(!user) return; // Only track logged in users
            try {
                await fetch('http://127.0.0.1:5000/api/history', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: user, article: item})
                });
            } catch(e) { console.error(e); }
        }

        async function showProfileModal() {
            const user = localStorage.getItem('currentUser');
            if(!user) return;
            
            document.getElementById('profileModal').style.display = 'block';
            document.getElementById('profileHistoryList').innerHTML = '<div class="loading"><div class="spinner"></div></div>';
            
            try {
                const res = await fetch(`http://127.0.0.1:5000/api/profile/${encodeURIComponent(user)}`);
                const data = await res.json();
                
                if(res.ok) {
                    document.getElementById('statTotalRead').innerText = data.total_read;
                    document.getElementById('statMostViewed').innerText = data.most_viewed_category;
                    
                    const listContainer = document.getElementById('profileHistoryList');
                    listContainer.innerHTML = '';
                    if(data.history.length === 0) {
                        listContainer.innerHTML = '<p style="text-align:center; color:#6c757d;">No reading history yet.</p>';
                    } else {
                        data.history.forEach(item => {
                            const sourceStr = item.display_source || item.source || 'News';
                            const title = item.title || 'Untitled';
                            listContainer.innerHTML += `
                                <div style="background: white; border: 1px solid #eee; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 5px;">
                                    <div style="font-weight: 600; font-size: 14px;">${title}</div>
                                    <div style="font-size: 12px; color: #6c757d;">
                                        <span style="background: #e9ecef; padding: 2px 6px; border-radius: 4px; margin-right: 8px;">${item.category || 'General'}</span>
                                        ${sourceStr}
                                    </div>
                                </div>
                            `;
                        });
                    }
                }
            } catch(e) { console.error(e); }
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        // Global variables
        let currentTab = 'home';
        let contentData = [];
        let timerInterval = null;
        let timerEndTime = 0;
        let focusLocked = false;
        let userXP = 0;
        let userLevel = 1;

        // Fallback content for when backend is not available
        const fallbackContent = [
            {
                "title": "Introduction to Machine Learning Algorithms",
                "description": "Comprehensive guide to supervised and unsupervised learning techniques, including neural networks and deep learning fundamentals",
                "type": "video",
                "source": "youtube",
                "category": "technology"
            },
            {

                "description": "Understanding the mathematical foundations of quantum physics, wave-particle duality, and quantum measurement theory",
                "type": "video",

                "category": "science"
            },

                "type": "video",
                "source": "youtube",
                "category": "history"
            },
            {
                "title": "World War II: Key Events and Turning Points",
                "description": "Comprehensive analysis of the major events, battles, and political decisions that shaped the outcome of World War II",
                "type": "blog",
                "source": "rss",
                "category": "history"
            },
            {
                "title": "CRISPR Gene Editing Technology Breakthrough",

                "type": "news",
                "source": "newsapi",
                "category": "biology"
            },
            {
                "title": "Climate Change: Scientific Evidence and Solutions",
                "description": "Analysis of global warming data, greenhouse gas emissions, and renewable energy transition strategies for sustainability",
                "type": "blog",
                "source": "rss",
                "category": "environment"
            },
            {
                "title": "The Mathematics of Artificial Intelligence",
                "description": "Linear algebra, calculus, and probability theory essential for understanding modern AI algorithms and machine learning models",
                "type": "blog",
                "source": "rss",
                "category": "mathematics"
            },

        async function loadCategoryContent(cat) {
            const container = document.getElementById('homeContent');
            try {
                let url = `http://127.0.0.1:5000/content/inshorts/${cat}`;
                
                if (cat === 'bookmarks') {
                    const user = localStorage.getItem('currentUser');
                    if (!user) {
                        showAuthModal();
                        container.innerHTML = '<div class="loading" style="grid-column:1/-1"><p>Please login to view your bookmarks.</p></div>';
                        return;
                    }
                    url = `http://127.0.0.1:5000/api/bookmarks?username=${encodeURIComponent(user)}`;
                }

                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 15000);
                const resp = await fetch(url, { signal: controller.signal });
                clearTimeout(tid);
                const data = await resp.json();
                contentData = Array.isArray(data) ? data : [];

                // Update status bar
                const statusDiv = document.getElementById('contentStatus');
                const catLabel = cat.charAt(0).toUpperCase() + cat.slice(1);
                statusDiv.innerHTML = `<i class="fas fa-check-circle" style="color:#28a745"></i> ${contentData.length} live ${catLabel} stories loaded`;
                statusDiv.style.color = '#28a745';

                renderCategoryContent(contentData);

            } catch (err) {
                console.error('Category fetch error:', err);
                // Fallback
                contentData = fallbackContent;
                document.getElementById('contentStatus').innerHTML =
                    `<i class="fas fa-info-circle" style="color:#17a2b8"></i> Using cached content — backend unreachable`;
                renderCategoryContent(contentData);
            }

        // Perform search

                // Show loading state
                const searchBtn = document.querySelector('.search-btn');

                const response = await fetch('http://127.0.0.1:5000/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();

                if (response.ok) {
                    // Switch to home tab and show search results
                    switchTab('home');
                    contentData = data.results || [];
                    renderContent();

                    // Update tab title to show search results
                    const searchType = data.search_type || 'search';
                    const matchedCategory = data.matched_category;
                    const totalFound = data.total_found || 0;
                    
                    if (searchType === 'category' && matchedCategory) {
                        document.querySelector('.nav-tab.active').textContent = `Category: ${matchedCategory} (${totalFound} results)`;
                    } else {
                        document.querySelector('.nav-tab.active').textContent = `Search: "${query}" (${totalFound} results)`;
                    }

                    // Award XP for searching
                    addXP(2);
                } else {
                    throw new Error(`Search failed: ${data.error || 'Unknown error'}`);
                }

            } catch (error) {
                console.error('Backend search error:', error);
                
                // Fallback to local search
                console.log('Falling back to local search...');
                const localResults = performLocalSearch(query);
                const isCategorySearch = PRODUCTIVE_CATEGORIES.some(cat => cat.toLowerCase() === query.toLowerCase());
                
                if (localResults.length > 0) {
                    // Switch to home tab and show local search results
                    switchTab('home');
                    contentData = localResults;
                    renderContent();

                    // Update tab title to show search results
                    const searchType = isCategorySearch ? 'Local Category' : 'Local Search';
                    document.querySelector('.nav-tab.active').textContent = `${searchType}: "${query}" (${localResults.length} results)`;

                    // Award XP for searching
                    addXP(1); // Less XP for local search
                } else {
                    alert(`No results found for "${query}". Try different keywords or make sure the backend is running for full search.`);
                }
            } finally {
                // Reset button state
                const searchBtn = document.querySelector('.search-btn');
                searchBtn.innerHTML = '<i class="fas fa-search"></i>';
                searchBtn.disabled = false;
            }
        }

        // Local search fallback
        function performLocalSearch(query) {
            const queryLower = query.toLowerCase().trim();
            
            // For debugging, always use fallback content
            const searchData = fallbackContent;
            
            // Check if query matches a known category
            const matchingCategory = PRODUCTIVE_CATEGORIES.find(cat => cat.toLowerCase() === queryLower);
            
            if (matchingCategory) {
                // Category-based search: return content classified under this category
                return searchData.filter(item => {
                    const itemCategory = (item.category || '').toLowerCase();
                    return itemCategory === matchingCategory.toLowerCase();
                });
            } else {
                // Keyword-based search (fallback) - improved logic
                const queryWords = queryLower.split(' ').filter(word => word.length > 0);
                
                return searchData.filter(item => {
                    const title = (item.title || '').toLowerCase();
                    const description = (item.description || '').toLowerCase();
                    const category = (item.category || '').toLowerCase();
                    const fullText = `${title} ${description} ${category}`;
                    
                    // Check if any of the query words appear in the content
                    // This is more flexible than requiring ALL words
                    return queryWords.some(word => fullText.includes(word));
                });
            }
        }

        // Timer functions
        function startTimer(minutes) {
            timerEndTime = Date.now() + (minutes * 60 * 1000);
            document.getElementById('timerDisplay').style.display = 'block';

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(updateTimer, 1000);
            addXP(5); // XP for starting a session
        }

        function updateTimer() {
            const now = Date.now();
            const remaining = Math.max(0, timerEndTime - now);

            if (remaining <= 0) {
                clearInterval(timerInterval);
                timerComplete();
                return;
            }

            const minutes = Math.floor(remaining / 60000);
            const seconds = Math.floor((remaining % 60000) / 1000);
            document.getElementById('timerText').textContent =
                `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function timerComplete() {
            document.getElementById('timerDisplay').style.display = 'none';
            addXP(20); // Bonus XP for completing session
            alert('🎉 Session complete! You earned 20 XP bonus!');
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('timerDisplay').style.display = 'none';
            timerEndTime = 0;
            alert('⏹️ Session stopped. You can start a new session anytime!');
        }

        // Focus lock
        function toggleFocus() {
            focusLocked = !focusLocked;
            const btn = document.getElementById('focusBtn');

            if (focusLocked) {
                btn.innerHTML = '<i class="fas fa-unlock"></i> Unlock Focus';
                btn.classList.remove('focus-btn');
                btn.classList.add('timer-btn');
                alert('Focus mode activated! Minimize distractions.');
            } else {
                btn.innerHTML = '<i class="fas fa-lock"></i> Lock Focus';
                btn.classList.remove('timer-btn');
                btn.classList.add('focus-btn');
            }
        }

        // Modal functions
        function closeModal() {
            document.getElementById('contentModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('contentModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // Show error message
        function showError(message) {
            const container = document.getElementById(currentTab + 'Content');
            container.innerHTML = `
                <div style="text-align: center; padding: 50px; color: white;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 48px; margin-bottom: 20px;"></i>
                    <p style="font-size: 18px;">${message}</p>
                    <p style="margin-top: 10px;">Make sure to start the backend with: <code>python simple_backend.py</code></p>
                </div>
            `;
        }
    </script>
</body>
</html>
